<style>
:root{--bg:#0f1412;--card:#18201c;--line:#2a3530;--text:#e9efe9;--sub:#9fb0a6;--accent:#4cc38a;--warn:#e0b44c;--on-accent:#06140d;--ok:#5fd07a;--ok-line:#1e7b34;--bad:#ff6b6b;--bad-line:#d50000;--warn-bg:#5a3d00;--warn-fg:#fff;--lock-on:#e0b44c;--lock-bg:color-mix(in srgb,var(--lock-on) 14%,transparent);--accent-soft:color-mix(in srgb,var(--accent) 16%,transparent);--fill:color-mix(in srgb,var(--text) 6%,transparent);--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--safe-t) + 10px) 14px 8px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 8px}
h2{font-size:18px;margin:18px 0 8px}
h3{font-size:16px;margin:14px 0 6px}
main{padding:10px 14px calc(90px + var(--safe-b))}
input,select,textarea,button{font:inherit;color:var(--text)}
input[type=search],input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);min-height:44px}
textarea{min-height:80px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.row>*{flex:1 1 140px}
.chips{display:flex;flex-wrap:wrap;gap:8px;overflow-x:auto;padding:6px 0 4px;margin:6px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);min-height:40px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip input{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.card .t{font-weight:600}
.meta{color:var(--sub);font-size:13px;margin:4px 0}
.desc{margin:6px 0 8px}
a.btn,button.btn,span.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;background:var(--accent);color:var(--on-accent);text-decoration:none;border:0;font-weight:600}
button.ghost,a.btn.ghost,span.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
details{border:1px solid var(--line);border-radius:14px;margin:10px 0;background:var(--card)}
details>summary{padding:14px;font-weight:600;list-style:none;cursor:pointer}
.diffd ul{margin:6px 0 0 18px;padding:0}.diffd li{margin:0 0 10px}
details>summary::after{content:"▾";float:right;color:var(--sub)}
details[open]>summary::after{content:"▴"}
details .inner{padding:0 10px 10px}
.muted{color:var(--sub)}
.callout{border-left:4px solid var(--accent);padding:10px 12px;background:var(--card);border-radius:10px;margin:10px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 10px;min-height:56px;font-size:12px;color:var(--sub)}
nav.tabs button .i{display:block;font-size:22px;line-height:24px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.block{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.block:last-child{border-bottom:0}
.block input{width:26px;height:26px;margin-top:2px;flex:0 0 auto;accent-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.stat{display:inline-block;margin-right:12px}
.vids{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.vids .btn{display:block;text-align:left;font-size:14px;padding:10px 12px;min-height:44px;box-sizing:border-box}
span.btn.none{display:block;padding:10px 12px;border-radius:12px;font-size:14px;background:transparent;border:1px dashed var(--line);color:var(--sub)}
html.aired nav.tabs{padding-right:92px}
details.rc{border-color:var(--accent)}
.count{color:var(--sub);font-size:14px;margin:6px 0}
nav.tabs button{font-size:10.5px;padding:6px 0 8px;min-width:0}
nav.tabs button .i{font-size:20px}
.dia svg{width:100%;height:auto;display:block;border-radius:10px;margin:8px 0}
a.btn.ghost2{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
label{display:block;margin:6px 0;font-size:14px}
label.tog{display:flex;gap:10px;align-items:flex-start;min-height:40px;padding:6px 0;font-size:15px}
label.tog input{width:24px;height:24px;flex:0 0 auto;accent-color:var(--accent)}
label.tog.big{font-weight:600;font-size:16px}
.ckgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.ckgrid label{display:flex;gap:8px;align-items:center;min-height:36px;margin:0}
.ckgrid input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--accent)}
.why{font-size:13px;color:var(--sub);margin-top:4px;font-style:italic}
.block.locked{background:var(--accent-soft);border-radius:8px}
.lockb{min-height:36px!important;padding:0 10px!important;font-size:13px;flex:0 0 auto}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);margin:2px 4px 2px 0;font-weight:600}
.pill.sourced,.pill.verified{background:#1d6b47;color:#fff;border-color:#1d6b47}
.pill.derived{background:#2c5d8f;color:#fff;border-color:#2c5d8f}
.pill.estimate{background:#6b6b6b;color:#fff;border-color:#6b6b6b}
.pill.major{background:#7a3db8;color:#fff;border-color:#7a3db8}
.pill.league{background:#2c5d8f;color:#fff;border-color:#2c5d8f}
.pill.unverified{background:#d9822b;color:#1b1203;border-color:#d9822b}
.pill.manual{background:#555;color:#fff}
.card.tour.unverified{border-left:5px solid #d9822b}
.card.tour.major{border-left:5px solid #7a3db8}
.card.tour.verified{border-left:5px solid #1d6b47}
.card.tour.league{border-left:5px solid #2c5d8f}
table.kv td:first-child{color:var(--sub);width:34%;white-space:nowrap}
table.kv td{padding:5px 4px;font-size:14px}
.legend{margin:6px 0 4px}
.callout.warnc{border-left-color:#d9822b}
.callout.remind{border-left-color:#7a3db8;font-weight:600}
.timer{position:sticky;top:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;z-index:2}
.timer .clock{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.timer.sttimer{position:relative;top:auto}.sttimer .row.strow{flex-wrap:wrap;gap:6px;justify-content:center}.sttimer .strow .btn{flex:1 1 30%;min-width:0;padding:0 8px}
.sttimer .clock.over{color:var(--warn)}.stup{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:16px;border:1px solid var(--warn)}
.btn.sm,button.btn.sm,span.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.stbtns{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stbtns .stnow{display:none;font-weight:700;color:var(--accent)}
.stcur{border-radius:10px;box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}.block.stcur{padding-left:8px;padding-right:8px}.stcur .stnow{display:inline}
#stpill{position:fixed;left:10px;right:10px;bottom:calc(66px + var(--safe-b));z-index:11;min-height:44px;border-radius:999px;border:1px solid var(--accent);background:var(--card);color:var(--text);font-weight:600;font-size:14px;padding:6px 14px;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stpill.over{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn)}
#sttoast{position:fixed;left:12px;right:12px;top:calc(10px + var(--safe-t));z-index:30;background:var(--card);color:var(--text);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.4);opacity:0;transform:translateY(-12px);transition:opacity .25s,transform .25s;pointer-events:none}#sttoast.show{opacity:1;transform:none}
.stset{margin-top:8px}.stask .row{margin-top:6px;gap:6px}
#ptinstall{position:fixed;left:10px;right:10px;bottom:calc(66px + var(--safe-b) + 10px);z-index:12;max-width:440px;margin:0 auto;background:var(--card);color:var(--text);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:20px;padding:16px 16px 12px;box-shadow:0 14px 40px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.2);font-size:15px;line-height:1.35;opacity:0;transform:translateY(16px);transition:opacity .28s ease,transform .32s cubic-bezier(.2,.8,.2,1)}
#ptinstall.in{opacity:1;transform:none}
#ptinstall.ins-ipad{bottom:auto;top:calc(var(--safe-t) + 12px);left:auto;right:14px;width:380px;margin:0}
.ins-head{display:flex;gap:12px;align-items:center}
.ins-ic{width:52px;height:52px;border-radius:12px;flex:0 0 auto;box-shadow:0 0 0 1px color-mix(in srgb,var(--text) 10%,transparent)}
.ins-ic8{display:flex;align-items:center;justify-content:center;background:#0b3d2e;color:#fff;font-weight:800;font-size:22px}
.ins-hd{flex:1;min-width:0}.ins-hd h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}.ins-hd h2 svg{width:20px;height:20px;color:var(--accent)}
.ins-sub{margin:3px 0 0;color:var(--sub);font-size:14px}
.ins-x{flex:0 0 auto;align-self:flex-start;width:36px;height:36px;margin:-6px -6px 0 0;border-radius:999px;border:0;background:var(--fill);color:var(--text);display:flex;align-items:center;justify-content:center;padding:0}.ins-x svg{width:18px;height:18px}
.ins-steps{list-style:none;margin:14px 0 4px;padding:0;display:grid;gap:8px}
.ins-steps li{display:flex;align-items:center;gap:10px;background:var(--fill);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.ins-n{flex:0 0 auto;width:22px;height:22px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.ins-g{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}.ins-g svg{width:20px;height:20px}
.ins-t{flex:1;min-width:0}.ins-t b{font-weight:650}.ins-dim{color:var(--sub);font-size:13px}
.ins-inl svg{width:15px;height:15px;vertical-align:-3px}
.ins-note{margin:6px 2px 0;color:var(--sub);font-size:13px}
.ins-acts{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.ins-pri{flex:1;min-height:44px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px}
.ins-sec{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-weight:600;font-size:15px}
.ins-lnk{min-height:44px;padding:0 6px;border:0;background:none;color:var(--sub);font-size:14px;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.ins-msg{margin:6px 2px 0;font-size:13px;color:var(--accent);word-break:break-all}.ins-msg:empty{display:none}
.ins-arrow{flex:0 0 auto;width:22px;height:22px;color:var(--accent);animation:insb 1.6s ease-in-out infinite}.ins-arrow svg{width:22px;height:22px}
#ptinstall.ins-ipad .ins-arrow{transform:rotate(180deg);animation-name:insu}
@keyframes insb{0%,100%{transform:translateY(-2px);opacity:.7}50%{transform:translateY(3px);opacity:1}}
@keyframes insu{0%,100%{transform:rotate(180deg) translateY(-2px);opacity:.7}50%{transform:rotate(180deg) translateY(3px);opacity:1}}
@media (prefers-reduced-motion: reduce){#ptinstall{transition:none}.ins-arrow{animation:none}}
#stpill{bottom:calc(66px + var(--safe-b) + var(--insh,0px))}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.mgrid label{min-width:0}
.mset{border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:4px 10px 8px}.mset legend{font-weight:700;padding:0 6px}
.mnet{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;border-radius:12px;padding:10px;margin:10px 0;border:2px solid var(--line)}.mnet b{font-size:22px}
.mnet.ok{border-color:var(--ok-line);background:color-mix(in srgb,var(--ok-line) 15%,transparent)}.mnet.bad{border-color:var(--bad-line);background:color-mix(in srgb,var(--bad-line) 12%,transparent)}.mnet.even{border-color:var(--line)}
.msum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.msum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}.msum span{display:block;font-size:12px;color:var(--sub)}.msum b{font-size:17px;font-variant-numeric:tabular-nums}
.msum .ok{border-color:var(--ok-line)}.msum .ok b{color:var(--ok)}.msum .bad{border-color:var(--bad-line)}.msum .bad b{color:var(--bad)}
.mrow{border-top:1px solid var(--line);padding:10px 0}.mrow:first-of-type{border-top:0}
.mcal{max-width:340px;margin:8px auto 0}.mcdisp{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:right;font-size:28px;font-variant-numeric:tabular-nums;min-height:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

// Refresh button: checks for a new version (service worker), applies it, then reloads. Never touches localStorage.
(function(){
  const msg = (t) => { const m = document.getElementById("ptrefmsg"); if (m) m.textContent = t; };
  const btn = () => document.getElementById("ptrefresh");
  let busy = false;
  const reload = (d) => setTimeout(() => location.reload(), d || 0);
  const waitState = (w, ms) => new Promise((res) => { if (!w) return res(); const t = setTimeout(res, ms); w.addEventListener("statechange", () => { if (w.state === "installed" || w.state === "activated" || w.state === "redundant") { clearTimeout(t); res(); } }); });
  async function run(){
    if (busy) return; busy = true; const b = btn(); if (b) b.classList.add("spin"); msg("Updating…");
    try {
      if (!("serviceWorker" in navigator)) { msg("Up to date ✓"); return reload(600); }
      const reg = await navigator.serviceWorker.getRegistration();
      if (!reg) { msg("Up to date ✓"); return reload(600); }
      let changed = false; navigator.serviceWorker.addEventListener("controllerchange", () => { changed = true; msg("Updated ✓"); reload(200); }, { once: true });
      try { await reg.update(); } catch (e) {}
      if (reg.installing) await waitState(reg.installing, 8000);
      if (reg.waiting) { msg("Updating…"); reg.waiting.postMessage({ type: "SKIP_WAITING" }); setTimeout(() => { if (!changed) reload(); }, 4000); return; }
      setTimeout(() => { if (!changed) { msg("Up to date ✓"); reload(700); } }, 500);
    } catch (e) { reload(300); }
  }
  document.addEventListener("click", (e) => { if (e.target.closest && e.target.closest("#ptrefresh")) run(); });
  window.PT_refresh = run;
})();

</script>

const GEO = [
  ["ghost", "B", "Contact point vs ghost ball", "The ghost ball is where the cue ball's center must be at the moment it touches the object ball. Its center sits one ball width behind the object ball, on the line from the pocket through the object ball's center. The contact point is the spot on the object ball farthest from the pocket. Aim the center of the cue ball at the ghost-ball center, not at the contact point; aiming the center at the contact point hits cuts too full.", "Ghost-ball center = OB center + 2.25 in (one ball diameter) along the pocket-to-OB line.", "Practice by placing a real ball at the ghost-ball spot, then removing it before you shoot (Dr. Dave).", [["Dr. Dave: ghost-ball aiming", "/faq/aiming/ghost-ball/"], ["Sharivari: why cuts go too full", "https://www.youtube.com/watch?v=yjxs0r3sAbE"]], [["Ghost-ball aiming (BU Vol. II)", "PyySqG_Asbw"], ["Using the cue to aim (NV 3.2)", "5R9x8LdTg5w"]]],
  ["fraction", "B", "Cut angle and fractional-ball aiming", "The ball-hit fraction is how much of the object ball the cue ball covers, seen from behind the cue ball at contact. A 1/2-ball hit is a 30° cut; a 3/4-ball hit is just under 15°; a 1/4-ball hit is about 48°. Learn those three and estimate everything else from them.", "sin(cut angle) = 1 − ball-hit fraction. Clock method: if 12 o'clock is straight, 1 o'clock is 30° and each minute is 6°.", "Calibrate three reference hits (3/4, 1/2, 1/4) until you can recognize them on sight.", [["Dr. Dave: fractional-ball aiming", "/faq/aiming/fractional/"], ["Ball-hit fraction vs cut angle (Bob Jewett, quoted)", "/faq/cut/ball-hit-fraction/"], ["TP A.23: ball-hit fraction vs cut angle", "/technical_proofs/new/TP_A-23.pdf"], ["Estimating cut angles (clock method)", "/faq/cut/estimating-angle/"]], [["Fractional-ball aiming (HAPS)", "2kuJTwQ1M9k"], ["The half-ball hit is important", "yr8jGPcyQ1M"]]],
  ["tangent", "B", "Tangent line and the 90° rule (stun)", "With a stun shot (no top or bottom spin at contact), the cue ball and object ball split at 90°. The object ball goes along the line of centers and the cue ball goes along the tangent line, perpendicular to it, at any cut angle. A straight-in stun is a stop shot.", "Separation angle = 90° for ideal balls (TP 3.1). TP A.5 covers how ball inelasticity and friction change it slightly.", "Use the 90° rule to check for scratches and to plan position before you shoot.", [["Dr. Dave: 90° rule", "/faq/stun/90-degree-rule/"], ["TP 3.1: 90° rule proof", "/technical_proofs/TP_3-1.pdf"], ["Dr. Dave: stun shot", "/faq/stun/shot/"]], [["90° rule at various cut angles (NV 3.4)", "xoG7iaVNhcE"], ["Hand visualization of the 90° rule (NV 3.5)", "8T-Ytbc6Yck"], ["Tangent line (Sharivari)", "_3NnmvKAIXU"], ["Tangent line (Venom, APA)", "FDuJiBFp974"]]],
  ["thirty", "B", "The 30° rule (rolling cue ball)", "With a rolling cue ball, over a wide range of cuts from about a 3/4-ball hit (14°) to a 1/4-ball hit (49°), the cue ball turns off its original line by close to 30°.", "≈30° carom angle; about 34° near a 1/2-ball hit and about 27° near the 1/4 or 3/4-ball ends.", "For any rolling shot in that range, picture the 30° line to predict where the cue ball goes and spot a scratch.", [["Dr. Dave: 30° rule", "/faq/30-90-rules/30-degree-rule/"], ["TP 3.3: 30° rule proof", "/technical_proofs/TP_3-3.pdf"], ["When the 30° rule applies", "/faq/30-90-rules/when-applies/"]], [["30° rule examples (VEPS III)", "3QvPYwWs1Ic"], ["Natural angles (Pool School)", "H8PeDTCr2ps"]]],
  ["mirror", "B", "Mirror and equal-angle kicks", "For a one-rail kick, imagine the target reflected across the rail. Aim at the reflection: the ball comes off the rail at about the same angle it went in. Dr. Dave calls the mirror system a visual version of the 2-to-1 system.", "Angle in ≈ angle out (rolling ball). Reference line: line of diamonds for slow shots, cushion nose for medium, rail groove for fast shots or targets near the rail.", "Pick the reference line for your speed before you aim.", [["Dr. Dave: mirror system", "/faq/bank-kick/mirror/"], ["Kick speed and distance effects", "/faq/bank-kick/speed-effects/"], ["TP 6.2: mirror-image kick geometry", "/technical_proofs/TP_6-2.pdf"]], [["Mirror kick system (HAPS)", "e7NY-nTQbus"], ["Kick mirror-image method (NV 6.4)", "O2T-UzXpD7I"]]],
  ["peace", "I", "The 30° peace sign", "Make a V-sign with your hand at the ghost ball: the index finger points along the tangent line (stun, 90°), and the middle finger shows the 30° rolling direction. Spreading the fingers to fit shows where both stun and roll will send the cue ball.", "Finger gap ≈ 60° (90° stun line vs 30° roll line).", "Calibrate your V-sign on a template, then use it before every position shot.", [["Dr. Dave: peace-sign technique", "/faq/30-90-rules/peace-sign/"]], [["30° rule peace sign", "JgKD-nqKTlQ"], ["Peace-sign calibration (NV B.44)", "NQcnKwOk0fg"]]],

  ["drawfollow", "I", "Follow and draw curves (trisect system)", "Off the tangent line, follow bends the cue ball forward and draw bends it back, in curves, not straight lines. For a good-action draw shot with a cut under about 40°, the final cue ball direction is about three times the cut angle off the original aim line.", "Trisect: final draw direction ≈ 3 × cut angle (cuts < ~40°).", "Use the trisect to aim draw caroms and to avoid drawing into a scratch.", [["Dr. Dave: trisect system", "/faq/draw/trisect/"], ["TP A.20: spin, speed and cut angle on draw", "/technical_proofs/new/TP_A-20.pdf"]], [["Trisect draw system (VEPS I)", "37OKxcHCEC8"], ["Draw trisect (BU Vol. II)", "gYdZqvWZt-4"], ["Cue ball physics (Sharivari)", "KL0W45AkNMo"]]],
  ["throw", "I", "Throw: cut-induced (CIT) and spin-induced (SIT)", "Friction between the balls during contact pushes the object ball slightly off the line of centers. Cut-induced throw comes from the cut angle; spin-induced throw comes from sidespin. Throw is biggest on slow stun shots near a 1/2-ball hit and smaller with topspin, draw or fast speed.", "Maximum throw is about 5°: roughly 1 inch per foot of OB travel, or half a ball per diamond on a 9 ft table.", "To compensate for cut-induced throw, overcut slightly (hit a little thinner). Outside 'gearing' english removes throw.", [["Dr. Dave: throw tutorial", "/tutorial/throw/"], ["Maximum throw", "/faq/throw/maximum/"], ["Cut-induced throw", "/faq/throw/cit/"], ["Spin-induced throw", "/faq/throw/sit/"], ["TP A.14: throw vs cut angle, speed and spin", "/technical_proofs/new/TP_A-14.pdf"]], [["CIT and SIT explained", "-jUL_8aZ2LU"], ["Top 10 things to know about throw", "5C7143wIc-M"], ["Ghost ball and throw (Pool School)", "4Z7UyPC2n0w"]]],
  ["squirt", "I", "Squirt (deflection) and swerve", "With sidespin, the cue ball squirts off the cue line, away from the side you hit, because the shaft's end mass is pushed aside. With an elevated cue it then swerves (curves) back toward the spin side. Together these are 'squerve', and they depend on the shaft, speed, distance and elevation.", "Squirt direction: opposite the english side. Swerve: toward the english side, more with slower speed and higher elevation.", "Keep the cue as level as you can, and learn how much your own shaft squirts.", [["Dr. Dave: what causes squirt", "/faq/squirt/cause/"], ["Swerve factors", "/faq/swerve/factors/"], ["Squirt, swerve and throw effects summary", "/faq/sidespin/aim/effects/"], ["TP A.31: physics of squirt", "/technical_proofs/new/TP_A-31.pdf"]], [["Squirt, swerve and throw (VEPS II)", "PKcST5CqBZM"], ["Squirt and endmass (NV B.32)", "DO5-v75Hmjg"], ["Cue ball deflection (Pool School)", "wj8cm4ZeOdQ"]]],
  ["pocket", "I", "Pocket geometry and effective pocket size", "A pocket's effective size depends on the angle and speed of the approaching ball. A ball coming straight into a corner pocket gets the biggest target; a ball running along the rail gets a smaller one, and faster balls get smaller targets still. Aiming off center ('cheating the pocket') is a way to change the cue ball's path.", "WPA mouth: corner 4.5–4.625 in, side 5–5.125 in (side is traditionally 1/2 in wider). Effective target sizes by angle and speed: Dr. Dave TP 3.5–3.8.", "On tight pockets, slow down and favor the side of the pocket that gives the larger target.", [["Dr. Dave: pocket size and center", "/faq/pocket/size-and-center/"], ["TP 3.6: corner pocket targets (slow)", "/technical_proofs/TP_3-6.pdf"], ["TP B.15: pocket geometry", "/technical_proofs/new/TP_B-15.pdf"], ["Pocket cheating", "/faq/pocket/cheat/"], ["WPA equipment specs (PDF)", "https://wpapool.com/wp-content/uploads/2024/01/RECOMMENDED-EQUIPMENT-SPECIFICATIONS.pdf"]], [["Smaller pockets don't always play smaller", "s5rbS2vuwdI"], ["Make the pockets play bigger (Feijen)", "tGBnhoGcluM"], ["How speed and spin affect aim", "XdjdgePMXFg"]]],
  ["margin", "I", "Margin of error vs distance", "A tiny aiming error grows as it travels. Dr. Dave shows that for a straight shot, difficulty is the product of the CB-to-OB and OB-to-pocket distances, so a shot is hardest when the object ball sits exactly halfway. Bigger cut angles cut the margin further.", "Straight shot: difficulty ∝ d(CB→OB) × d(OB→pocket); hardest at the halfway point (TP 3.4).", "When choosing between shots, prefer the shorter combined distance and the smaller cut.", [["Dr. Dave: cut-shot margin for error", "/faq/cut/margin-for-error/"], ["TP 3.4: margin of error vs distance and cut angle", "/technical_proofs/TP_3-4.pdf"]], [["Top 10 aim/alignment drills (includes the halfway diagonal shot)", "D3oj9lte_5o"]]],
  ["english", "I", "English off the rails", "Sidespin mainly changes what the cue ball does off a cushion. Running english widens the rebound and keeps more speed; reverse english shortens it and kills speed. The effect is largest heading straight into the rail and small at shallow angles. Sidespin doesn't change the stun tangent-line direction, but it does change object ball throw.", "Biggest speed difference at about 20–40° from perpendicular into the rail (Dr. Dave).", "Use english for angle off the rail, not to change the cue ball's direction off the object ball.", [["Bank and kick effects (speed, spin, cut)", "/faq/bank-kick/effects/"], ["30° and 90° rule sidespin effects", "/faq/30-90-rules/sidespin/"]], [["Sidespin: everything you need to know", "6-vNQwD5WDw"], ["Cue ball control: everything you need to know", "fPQEBxbByD4"]]],
  ["carom", "I", "Carom and kiss angles", "To play a carom (the cue ball glances off one ball into another) or a kiss, use the same reference lines: the 90° tangent line for stun, the 30° line for roll, and the trisect for draw. Frozen kisses can change direction with fullness of hit.", "Stun carom: 90° off the line of centers. Rolling carom: ~30° off the aim line.", "Check whether a kiss is on before every shot near a cluster.", [["Dr. Dave: carom and kiss shot aiming", "/faq/30-90-rules/carom/"], ["TP A.2: carom shot vs cut shot", "/technical_proofs/new/TP_A-2.pdf"]], [["Rail-first carom and kiss shots", "k6qsxYm-_Fw"], ["Double-kiss shots", "c8ztEYGdga0"], ["Carom trisect draw (HAPS)", "PdZ4hB9Rpds"]]],
  ["diamond", "E", "Diamond systems: 2-to-1, Plus and Corner-5", "Diamond systems number the rails so you can calculate an aim point. The 2-to-1 system (and its visual cousins, mirror and equal-distance) handles one-rail kicks. The Plus System handles two-rail kicks off a short rail. Corner-5 handles three-rail kicks with running english, aiming through the diamonds.", "Corner-5: third-rail number T = D − F (D = starting number, F = first-rail number), e.g. 2.5 = 4.5 − 2 (TP 7.2). Diamonds: 1/8 of the length and 1/4 of the width apart.", "Systems give a reference line only; adjust for speed, spin and table.", [["Dr. Dave: 2-to-1 system", "/faq/bank-kick/two-to-one/"], ["Plus System", "/faq/bank-kick/plus/"], ["Corner-5 system", "/faq/bank-kick/corner-5/"], ["TP 7.2: Corner-5 formulas", "/technical_proofs/TP_7-2.pdf"], ["Diamond systems overview", "/faq/bank-kick/diamond-systems/"]], [["The only diamond system you need (2-to-1)", "4QWcQhytefI", 39], ["Plus System (VEPS IV)", "2BsOZ09Nsyg"], ["Corner-5 System (VEPS IV)", "G4dv9ekF3FY"], ["Top 10 bank and kick systems", "U5Exnt3WDXA"]]],
  ["bank", "E", "Bank shot geometry and spin effects", "Real banks don't come off at a perfect mirror angle. More speed shortens the rebound; topspin lengthens kick rebounds and backspin shortens them; an outside cut shortens a bank and an inside cut lengthens it. Because the cushion bounces back with less than full speed, the rebound angle from the perpendicular is larger than the approach angle.", "TP 6.3: rebound angle θr > approach angle θa because the rail's coefficient of restitution e < 1. Many top bankers use firm speed for consistency.", "Pick one speed for banks and learn how your table plays at that speed.", [["Bank and kick physics effects", "/faq/bank-kick/effects/"], ["Fast-speed bank advantages", "/faq/bank-kick/fast-advantages/"], ["TP 6.3: rail restitution and rebound angle", "/technical_proofs/TP_6-3.pdf"], ["Bank shot spin transfer", "/faq/bank-kick/spin-transfer/"]], [["Bending, twisting and stiffening banks", "9br8xdXEs7g"], ["Spin-transfer bank shots (NV B.20)", "u5cOLa7HtiM"]]],
  ["gearing", "P", "Gearing outside english and throw plots", "The exact amount of outside english that makes the cue ball's surface roll across the object ball, with no rubbing, removes throw completely. It is handy when balls are dirty (cling) or when you don't want to judge throw.", "40% rule (Dr. Dave): parallel-shift the line of centers to the cue ball; put the tip 40% of the way from center toward that point (TP A.26). Throw contour plots: TP B.3.", "Use gearing outside english on thin cuts with dirty balls.", [["Dr. Dave: gearing outside spin", "/faq/sidespin/outside-gearing/"], ["TP A.26: sidespin for gearing", "/technical_proofs/new/TP_A-26.pdf"], ["TP B.3: throw contour plots", "/technical_proofs/new/TP_B-3.pdf"]], [["Top 10 things to know about throw", "5C7143wIc-M"]]],
  ["pivot", "P", "Squirt compensation: pivot length (BHE/FHE)", "Back-hand english: line up center ball, then pivot the cue from the back hand to add english. If the pivot point matches the cue's natural pivot length, the squirt cancels the offset and the cue ball still heads where you aimed (before swerve and throw). Low-squirt shafts have longer pivot lengths.", "TP B.1: squirt angle, pivot length and tip size; TP B.26: BHE/FHE pivot relation.", "Measure your shaft's natural pivot length once, then set your bridge there for BHE.", [["Natural pivot length", "/faq/cue/natural-pivot-length/"], ["Back-hand and front-hand english", "/faq/sidespin/bhe-fhe/"], ["TP B.1: squirt angle and pivot length", "/technical_proofs/new/TP_B-1.pdf"]], [["Is a low-squirt cue better?", "qdKQmL-Ulxc"]]],
  ["vision", "I", "Cut geometry, cross-eye dominance and right-cut misses", "Dr. Dave: if your head is off your vision center, the cue looks angled, you compensate, and the miss goes to one side (head too far right sends the object ball right; too far left sends it left). Because an aiming error grows with distance (TP 3.4), a small head bias shows up most on long cuts. Any sighting line that isn't parallel to the aiming line is a problem.", "Same error, longer shot = bigger miss (TP 3.4).", "If you miss more to one side, recheck your vision center before changing your aim.", [["Dr. Dave: vision center", "/faq/eyes/vision-center/"], ["VEPP vision-center drill (BD Apr 2012, PDF)", "/bd_articles/2012/april12.pdf"], ["Aim, Align, Sight: sighting (BD Aug 2011, PDF)", "/bd_articles/2011/aug11.pdf"]], [["Vision-center drill (VEPP I)", "680o8EChP_o"], ["Find your vision center", "5vgY89yDrjE", 181]]],
];
const CUT_TABLE = [["Full (1)", "0°"], ["7/8", "7.2°"], ["3/4", "14.5°"], ["5/8", "22.0°"], ["1/2", "30.0°"], ["3/8", "38.7°"], ["1/4", "48.6°"], ["1/8", "61.0°"], ["Edge (0)", "90° (impossible in practice)"]];

<script>
// Shot Lab: to-scale table, drag balls, shot suggestions (approximate training aid), photo-to-layout.
(function(){
const R = 1.125; // ball radius, in (2.25 in ball, WPA)
const TABLES = { "7": { L: 78, W: 39, name: "7 ft (78x39 in, typical bar box; not regulated)" }, "8": { L: 88, W: 44, name: "8 ft (88x44 in)" }, "8p": { L: 92, W: 46, name: "8 ft pro / 8.5 ft (92x46 in, WPA 8 ft)" }, "9": { L: 100, W: 50, name: "9 ft (100x50 in, WPA)" }, "10": { L: 112, W: 56, name: "10 ft (112x56 in, oversize)" } };
const MOUTH = { corner: 4.5625, side: 5.0625 }; // WPA ranges 4.5-4.625 / 5-5.125 in (midpoints)
const COL = { 1: "#f5c518", 2: "#1e5bd8", 3: "#d32f2f", 4: "#6a1b9a", 5: "#ef6c00", 6: "#1b8f3a", 7: "#7b1f1f", 8: "#111" };
const ballCol = (n) => COL[n > 8 ? n - 8 : n] || "#9e9e9e";
const TIPS = [["Max low (≈1.5 tips low)", -1.25], ["1 tip low", -0.9], ["1/2 tip low", -0.45], ["Center", 0], ["1/2 tip high", 0.45], ["1 tip high", 0.9], ["Max high (≈1.5 tips high)", 1.25]];
const SPEEDS = [["Soft", 30], ["Medium", 55], ["Firm", 85], ["Power", 120]]; // in/s at the cue ball (rough)
const MU_S = 0.2, MU_R = 0.012, G = 386, E_RAIL = 0.75; // sliding / rolling friction, gravity in/s^2, rail restitution (rough)
const PKNAME = { TL: "top-left corner", TS: "top side", TR: "top-right corner", BL: "bottom-left corner", BS: "bottom side", BR: "bottom-right corner" };
const PKIDS = ["TL", "TS", "TR", "BL", "BS", "BR"];
const LS = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const SS = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const cssVar = (n, fb) => { try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || fb; } catch (e) { return fb; } };
const v2 = { add: (a, b) => [a[0] + b[0], a[1] + b[1]], sub: (a, b) => [a[0] - b[0], a[1] - b[1]], mul: (a, s) => [a[0] * s, a[1] * s], dot: (a, b) => a[0] * b[0] + a[1] * b[1], len: (a) => Math.hypot(a[0], a[1]), norm: (a) => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; } };

function pockets(T){ const { L, W } = T; return [["TL", [0, 0], "corner"], ["TS", [L / 2, -0.6], "side"], ["TR", [L, 0], "corner"], ["BL", [0, W], "corner"], ["BS", [L / 2, W + 0.6], "side"], ["BR", [L, W], "corner"]]; }
// aim point a little inside the pocket mouth center
function aimPoint(p, T){ const [id, c, k] = p; if (k === "side") return [c[0], c[1] < 1 ? 0.4 : T.W - 0.4]; const dx = c[0] === 0 ? 1 : -1, dy = c[1] === 0 ? 1 : -1; return [c[0] + dx * 0.9, c[1] + dy * 0.9]; }
function distSeg(p, a, b){ const ab = v2.sub(b, a), t = Math.max(0, Math.min(1, v2.dot(v2.sub(p, a), ab) / (v2.dot(ab, ab) || 1))); return [v2.len(v2.sub(p, v2.add(a, v2.mul(ab, t)))), t]; }

// Cue ball travel to contact: returns speed and spin ratio at contact (spin ratio 1 = natural roll)
function approach(v0, k0, d){ let v = v0, w = k0 * v0, s = 0; const dt = 0.002;
  while (s < d && v > 0.5){ const slip = v - w; if (Math.abs(slip) > 0.3){ const sg = Math.sign(slip); v -= sg * MU_S * G * dt; w += sg * 2.5 * MU_S * G * dt; } else { v -= MU_R * G * dt; w = v; } s += v * dt; }
  return { v: Math.max(v, 0), k: v > 0 ? w / v : 1, reached: s >= d }; }

// Simulate CB after contact: velocity Va (vector) and spin vector (velocity-equivalent) Ws. Rails reflect. Returns path points.
function simCB(start, Va, Ws, T, side){ let p = start.slice(), v = Va.slice(), w = Ws.slice(); const pts = [p.slice()]; const dt = 0.004; let rails = 0, t = 0;
  const minX = R, maxX = T.L - R, minY = R, maxY = T.W - R;
  while (t < 20){ const slip = v2.sub(v, w), sl = v2.len(slip);
    if (sl > 0.4){ const u = v2.mul(slip, 1 / sl); v = v2.sub(v, v2.mul(u, MU_S * G * dt)); w = v2.add(w, v2.mul(u, 2.5 * MU_S * G * dt)); }
    else { const sp = v2.len(v); if (sp < 0.6) break; const nv = Math.max(sp - MU_R * G * dt, 0); v = v2.mul(v, nv / sp); w = v.slice(); }
    p = v2.add(p, v2.mul(v, dt)); t += dt;
    let hit = false;
    if (p[0] < minX || p[0] > maxX){ p[0] = p[0] < minX ? minX : maxX; v[0] = -v[0] * E_RAIL; w[0] = -w[0] * 0.5; hit = true; }
    if (p[1] < minY || p[1] > maxY){ p[1] = p[1] < minY ? minY : maxY; v[1] = -v[1] * E_RAIL; w[1] = -w[1] * 0.5; hit = true; }
    if (hit){ rails++; if (side){ const sp = v2.len(v); const along = v2.norm(Math.abs(v[0]) > Math.abs(v[1]) ? [v[0], 0] : [0, v[1]]); v = v2.add(v, v2.mul(along, side * 0.15 * sp)); side *= 0.4; } pts.push(p.slice()); }
    if (pts.length < 400 && (t % 0.05) < dt) pts.push(p.slice());
    if (pocketedAt(p, T)) { pts.push(p.slice()); return { pts, end: p, rails, scratch: true }; }
  }
  pts.push(p.slice()); return { pts, end: p, rails, scratch: false }; }
function pocketedAt(p, T){ return pockets(T).some(([id, c, k]) => v2.len(v2.sub(p, c)) < (k === "corner" ? MOUTH.corner * 0.5 : MOUTH.side * 0.5)); }

// Cut-induced throw estimate (rough, after Dr. Dave TP A.14 trends): biggest near half-ball, slower = more, roll halves it
function throwDeg(cutDeg, speedIn, kAtContact){ const base = speedIn < 40 ? 5 : speedIn < 70 ? 3.8 : speedIn < 100 ? 2.8 : 2.2; const shape = Math.sin(Math.min(cutDeg, 89) * Math.PI / 180 * 2) ** 0.6; const rollF = kAtContact > 0.6 ? 0.5 : 1; return cutDeg < 1 ? 0 : base * shape * rollF; }

function blockList(arr){
  const names = arr.map((b) => b.n ? String(b.n) : "?");
  if (!names.length) return "";
  if (names.length === 1) return "the " + names[0] + " ball";
  if (names.length === 2) return "the " + names[0] + " and " + names[1] + " balls";
  return "the " + names.slice(0, -1).join(", ") + " and " + names[names.length - 1] + " balls";
}
function evalPocket(p, O, C, others, T){
  const P = aimPoint(p, T), u = v2.norm(v2.sub(P, O)), Gb = v2.sub(O, v2.mul(u, 2 * R)), aim = v2.norm(v2.sub(Gb, C));
  const cut = Math.acos(Math.max(-1, Math.min(1, v2.dot(aim, u)))) * 180 / Math.PI;
  const blockOB = others.filter((b) => distSeg([b.x, b.y], O, P)[0] < 2 * R - 0.05);
  const blockCB = others.filter((b) => distSeg([b.x, b.y], C, Gb)[0] < 2 * R - 0.05);
  let angOK = true; if (p[2] === "side"){ const a = Math.abs(Math.atan2(Math.abs(u[1]), Math.abs(u[0])) * 180 / Math.PI); angOK = a > 35; }
  const gbOK = Gb[0] >= R - 0.2 && Gb[0] <= T.L - R + 0.2 && Gb[1] >= R - 0.2 && Gb[1] <= T.W - R + 0.2;
  let why = "";
  if (cut >= 85) why = "Not makeable: cut too thin";
  else if (!angOK) why = "Not makeable: the side pocket angle is too narrow";
  else if (!gbOK) why = "Not makeable: the ghost-ball position is off the table";
  else if (blockOB.length) why = "Shot not possible to this pocket: path blocked by " + blockList(blockOB);
  else if (blockCB.length) why = "Shot not possible to this pocket: cue-ball path blocked by " + blockList(blockCB);
  return { p, P, u, Gb, aim, cut, blockOB: blockOB.length, blockCB: blockCB.length, blockOBs: blockOB, blockCBs: blockCB, angOK, gbOK, why, dOP: v2.len(v2.sub(P, O)), dCG: v2.len(v2.sub(Gb, C)) };
}
function bestOf(list){ return list.slice().sort((a, b) => (a.cut + a.dOP * 0.3) - (b.cut + b.dOP * 0.3))[0]; }

function analyze(L, T){ // L: layout {cb:[x,y], balls:[{n,x,y}], ob: n, pocket: id|'auto', target:[x,y]|null}
  const out = { ok: false, msg: "", cands: [], suggest: null };
  if (!L.cb) { out.msg = "Place the cue ball."; return out; }
  const ob = L.balls.find((b) => b.n === L.ob) || L.balls[0];
  if (!ob) { out.msg = "Add a ball, then tap it to make it the object ball."; return out; }
  const O = [ob.x, ob.y], C = L.cb;
  const others = L.balls.filter((b) => b !== ob);
  const all = pockets(T).map((p) => evalPocket(p, O, C, others, T));
  const makeable = all.filter((x) => !x.why);
  const wanted = L.pocket && L.pocket !== "auto" ? all.find((x) => x.p[0] === L.pocket) : null;
  let pk = wanted || bestOf(makeable) || bestOf(all.filter((x) => x.cut < 85 && x.angOK)) || all[0];
  out.pk = pk;
  if (pk && pk.why){
    out.msg = pk.why;
    const alt = bestOf(makeable.filter((x) => x !== pk));
    if (alt){ out.suggest = alt; out.msg += ". Try the " + PKNAME[alt.p[0]] + "."; }
    return out;
  }
  if (!pk){ out.msg = "No makeable shot to that pocket."; return out; }
  out.ok = true;
  const tgt = L.target || [T.L * 0.5, T.W * 0.5];
  const sims = [];
  for (const [tl, k0] of TIPS) for (const [sl, v0] of SPEEDS) for (const side of [0, -1, 1]) {
    if (side && Math.abs(k0) > 0.9) continue;
    const a = approach(v0, k0, pk.dCG); if (!a.reached || a.v < 2) continue;
    const n = pk.u, t0 = v2.sub(pk.aim, v2.mul(n, v2.dot(pk.aim, n))); const tl0 = v2.len(t0); const tdir = tl0 > 1e-6 ? v2.mul(t0, 1 / tl0) : [0, 0];
    const cr = pk.cut * Math.PI / 180, Va = v2.mul(tdir, a.v * Math.sin(cr)), Ws = v2.mul(pk.aim, a.k * a.v);
    // object ball must reach the pocket: OB leaves at v cos(cut), slides then rolls at 5/7 of that speed
    const vOB = a.v * Math.cos(cr) * (5 / 7), dOB = vOB * vOB / (2 * MU_R * G);
    const th = throwDeg(pk.cut, a.v, a.k), miss = pk.dOP * Math.tan(th * Math.PI / 180);
    const r = simCB(pk.Gb, Va, Ws, T, side);
    // kisses: first ball within 2R of the CB path
    let kiss = null; for (let i = 1; i < r.pts.length && !kiss; i++){ for (const q of others){ if (distSeg([q.x, q.y], r.pts[i - 1], r.pts[i])[0] < 2 * R - 0.05){ kiss = [q.x, q.y]; break; } } }
    if (v2.len(v2.sub(r.end, O)) < 2 * R && pk.cut < 3 && k0 > 0) kiss = O;
    const dist = v2.len(v2.sub(r.end, tgt));
    const score = dist + (r.scratch ? 200 : 0) + (kiss ? 40 : 0) + (dOB < pk.dOP ? 300 : 0) + (side ? 2 : 0) + Math.max(0, r.rails - 2) * 1.5;
    sims.push({ tip: tl + (side ? (side < 0 ? " + left english" : " + right english") : ""), speed: sl, k0, side, r, kiss, dist, score, th, miss, obShort: dOB < pk.dOP, kc: a.k });
  }
  sims.sort((a, b) => a.score - b.score);
  const seen = new Set(); for (const s of sims){ const key = s.tip + s.speed; const endKey = Math.round(s.r.end[0] / 3) + "," + Math.round(s.r.end[1] / 3); if (seen.has(key) || seen.has(endKey)) continue; seen.add(key); seen.add(endKey); out.cands.push(s); if (out.cands.length >= 5) break; }
  return out; }

// ---------- UI ----------
let T, Lay, sel = null, res = null, showIdx = 0, fsOn = false, pickOn = false, shotMsg = "", fsScrollY = 0, _redraw = null;
const defLayout = () => ({ size: "9", cb: [25, 25], balls: [{ n: 1, x: 70, y: 18 }], ob: 1, pocket: "auto", target: [60, 34], name: "", notes: "" });
function load(){
  Lay = LS("pt_lab_cur", null) || defLayout();
  T = TABLES[Lay.size] || TABLES["9"];
  const savedPk = LS("pt_lab_pocket", null);
  if (savedPk === "auto" || (typeof savedPk === "string" && PKIDS.includes(savedPk))) Lay.pocket = savedPk;
  if (!Lay.pocket) Lay.pocket = "auto";
}
function persist(){ SS("pt_lab_cur", Lay); SS("pt_lab_pocket", Lay.pocket || "auto"); }

function enterFS(){

function exitFS(){

function placeRack(kind){
  const d = 2 * R, dx = d * Math.sqrt(3) / 2, foot = [T.L * 3 / 4, T.W / 2];
  const rows = kind === 9 ? [1, 2, 3, 2, 1] : [1, 2, 3, 4, 5];
  const spots = [];
  for (let r = 0; r < rows.length; r++){
    const n = rows[r], y0 = foot[1] - (n - 1) * d / 2;
    for (let i = 0; i < n; i++) spots.push([foot[0] + r * dx, y0 + i * d]);
  }
  let nums;
  if (kind === 9) nums = [1, 2, 3, 4, 9, 5, 6, 7, 8];
  else {
    nums = new Array(15); nums[0] = 1; nums[4] = 8; nums[10] = 2; nums[14] = 15;
    const rest = [3, 4, 5, 6, 7, 9, 10, 11, 12, 13, 14];
    let j = 0; for (let i = 0; i < 15; i++) if (!nums[i]) nums[i] = rest[j++];
  }
  Lay.balls = spots.map((p, i) => ({ n: nums[i], x: Math.max(R, Math.min(T.L - R, p[0])), y: Math.max(R, Math.min(T.W - R, p[1])) }));
  Lay.cb = [T.L / 4, T.W / 2];
  Lay.ob = 1;
  Lay.target = [T.L * 0.5, T.W * 0.5];
  sel = null;
}

function freeSpot(){ for (let i = 0; i < 200; i++){ const p = [R + Math.random() * (T.L - 2 * R), R + Math.random() * (T.W - 2 * R)]; if ([Lay.cb, ...Lay.balls.map((b) => [b.x, b.y])].every((q) => !q || v2.len(v2.sub(p, q)) > 3 * R)) return p; } return [T.L / 2, T.W / 2]; }
function toggleBall(n){
  if (n === "cb"){
    if (Lay.cb) Lay.cb = null;
    else { const sp = freeSpot(); Lay.cb = sp; }
    sel = Lay.cb ? "cb" : null;
    persist(); return;
  }
  const i = Lay.balls.findIndex((x) => x.n === n);
  if (i >= 0){
    Lay.balls.splice(i, 1);
    if (sel && sel !== "cb" && sel.n === n) sel = null;
    if (Lay.ob === n) Lay.ob = Lay.balls[0] ? Lay.balls[0].n : null;
  } else {
    const sp = freeSpot();
    const b = { n, x: sp[0], y: sp[1] };
    Lay.balls.push(b);
    if (!Lay.ob) Lay.ob = n;
    sel = b;
  }
}

async function captureTable(){
  const svg = document.getElementById("labsvg");
  if (!svg) throw new Error("No table to capture");
  const clone = svg.cloneNode(true);
  clone.querySelectorAll("[data-pk]").forEach((c) => { if (c.getAttribute("fill-opacity") === "0") c.remove(); });
  const vb = (clone.getAttribute("viewBox") || "0 0 100 100").trim().split(/[\s,]+/).map(Number);
  const w = vb[2], h = vb[3], scale = 3;
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  clone.setAttribute("width", String(Math.round(w * scale)));
  clone.setAttribute("height", String(Math.round(h * scale)));
  const xml = new XMLSerializer().serializeToString(clone);
  const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("Could not render the table image")); img.src = url; });
  const cv = document.createElement("canvas");
  cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
  cv.getContext("2d").drawImage(img, 0, 0);
  const blob = await new Promise((res) => cv.toBlob(res, "image/png"));
  if (!blob) throw new Error("Could not make a PNG");
  const file = new File([blob], "road-warrior-shot.png", { type: "image/png" });
  if (navigator.share && navigator.canShare){
    try {
      if (navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], title: "Shot Lab", text: "Road Warrior shot" });
        return "Screenshot shared.";
      }
    } catch (e){ if (e && e.name === "AbortError") return ""; }
  }
  const href = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = href; a.download = "road-warrior-shot.png"; document.body.appendChild(a); a.click(); a.remove();
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios) window.open(href, "_blank");
  else setTimeout(() => URL.revokeObjectURL(href), 4000);
  return ios ? "Screenshot ready. Press and hold the image to save it to Photos." : "Screenshot saved.";
}

<script>

  ["Frozen", [["Touching a rail OR touching another ball", ["wpa8", "wpa9", "wpa10", "wpa141", "csi", "upl"], "wpa", "2.7, 3.7 (also CSI 1-20; UPL 5.5.9, §11 Sec. 14)"], ["Touching a cushion only; ball against ball is a 'touching ball'", ["ieb", "upg"], "ieb", "6h, 6o"], ["Not used; the rulebook only says 'touching balls'", ["wepf", "wpabb", "ipa"], "wepf", "R (WPA 8.9)"]], "Same word, different meaning. In American rules 'frozen' covers ball-on-ball; in International Rules it means a ball on a cushion."],
  ["Loss of turn", [["A named no-foul result with NO ball in hand: the opponent plays the cue ball from where it lies. Cases: hitting your own ball first but potting only an opponent's ball, or failing a combination (6d). On an open table: not naming a non-obvious group, missing the called group, or hitting it but potting the other group (6a(5)(b)–(d)). One exception: an in-off on a legal break is loss of turn plus one visit in hand from baulk (4j)", ["ieb", "upg"], "ieb", "6d, 6a(5), 4j"], ["A named no-foul result with NO ball in hand: the opponent plays from where the cue ball lies. Cases: a combination or defensive shot that pockets only an opponent's ball; on an open table, hitting one group first but pocketing only the other; not declaring your group when required", ["upl"], "upl", "§11 Sec. 7, 8, 10"], ["Not calling the pocket on a kick, jump, massé or combo is loss of turn, and the opponent shoots from where the cue ball stops. Elsewhere NAPA pairs it with a ball-in-hand foul", ["napa"], "napa", "1.2, 1.5"], ["Not calling a bank or combination is loss of turn. Elsewhere VNEA pairs it with a foul ('foul and loss of turn', ball in hand)", ["vnea"], "vnea", "D, B.3"], ["The rulebook doesn't name it: a miss just ends your inning, and fouls give ball in hand. Players say 'loss of turn' loosely", ["wpa8", "csi"], "csi", "2-7, 1-21"], ["No no-foul version for potting only an opponent's ball: that is a foul (a free shot under WPA Blackball; two visits under World Rules)", ["wpabb", "ipa", "wepf"], "wpa", "8.13(a) (WEPF K(3))"]], "Loss of turn means your turn ends for a reason other than a plain miss. In American play it almost always comes with a foul, so the opponent gets ball in hand. International Rules, Ultimate Pool and US UPL also have loss of turn with NO foul and NO ball in hand: the opponent plays from where the cue ball lies (Intl 6d, 6a(5); UPL Sec. 10). Don't pick up the cue ball."],

e. 'Snookered', 'hooked' and 'hidden' are common informal words", ["wpa9", "wpa10", "upl"], "wpa", "5, 6.5 (UPL §11 Sec. 7)"]], "Everyone uses the idea: the cue ball can't see the ball you need to hit. American players say 'snookered', 'hooked' or 'hidden', but American rulebooks don't define it. Intentional vs accidental: an intentional snooker is a safety. The rules notice that only through the safety call (TAP: call 'defense' whenever you aren't trying to pocket a ball; WPA, CSI, NAPA and VNEA: call 'safety' so a pocketed ball doesn't keep you shooting). Real cross-over gotchas: under WPA Blackball and International Rules, deliberately fouling to leave a snooker loses the rack or frame (WPA 8.14(c)(d); Intl 6f(1), 6f(5)), while in American rules a foul is just ball in hand. Under World Rules, only a snooker left by a foul gives foul-snooker options (P)."],

const BY = {}; E.forEach((e) => e.keys.forEach((k) => BY[k] = e));
const COL = { 1: "#f5c518", 2: "#1e5bd8", 3: "#d32f2f", 4: "#6a1b9a", 5: "#ef6c00", 6: "#1b8f3a", 7: "#7b1f1f", 8: "#111" };
const col = (n) => COL[n > 8 ? n - 8 : n] || "#9e9e9e";
function svg(e){ const rail = 4.5; let s = `<svg viewBox="${-rail} ${-rail} ${L + 2 * rail} ${W + 2 * rail}" style="width:100%;height:auto;display:block;border-radius:10px;background:#4a2c17" role="img" aria-label="${e.name} layout (AI-generated)">`;
  s += `<rect x="0" y="0" width="${L}" height="${W}" fill="#1f6f43"/>`;
  for (let i = 1; i < 8; i++) s += `<circle cx="${L * i / 8}" cy="${-rail / 2}" r=".45" fill="#eee"/><circle cx="${L * i / 8}" cy="${W + rail / 2}" r=".45" fill="#eee"/>`;
  for (let i = 1; i < 4; i++) s += `<circle cx="${-rail / 2}" cy="${W * i / 4}" r=".45" fill="#eee"/><circle cx="${L + rail / 2}" cy="${W * i / 4}" r=".45" fill="#eee"/>`;
  s += `<line x1="25" y1="0" x2="25" y2="${W}" stroke="#ffffff33" stroke-width=".25"/><circle cx="75" cy="25" r=".4" fill="#ffffff66"/>`;
  [[0, 0, 4.56], [50, -0.6, 5.06], [L, 0, 4.56], [0, W, 4.56], [50, W + 0.6, 5.06], [L, W, 4.56]].forEach(([x, y, m]) => s += `<circle cx="${x}" cy="${y}" r="${m / 2}" fill="#050505"/>`);

<p><b>Calibration steps.</b> 1) Pick the table size and enter the lens height above the cloth and how far outside the cushion the lens is (used to correct where ball centers appear). 2) Grab a frame and tap the 4 playing-surface corners where the cushion noses meet: 1 and 2 along the rail nearest the camera, then 3 and 4. 3) Drag or nudge each mark until it sits exactly on the corner; check the top-down view. 4) Save the setup. Redo it if the phone or mount moves.</p>
<p><b>Layouts and shots.</b> Grab a frame to find the balls, fix any mistakes, and save. To record a shot, start tracking before you stroke; paths for every ball that moves are saved with the layout. Trim or auto-clean bad points.</p>
<p><b>Projector.</b> Open projector mode, tap Calibrate, drag handles 1–4 onto the same table corners you used for the camera, fine-tune with the arrows, then turn on the test grid: dashed lines should hit the diamonds and the 6-inch grid should look square. Set the balls inside the projected circles and shoot it again.</p>
<p class="meta">Accuracy: with good light and a careful calibration, expect ball positions within about ¼ to ½ inch, usually better near the camera. Touching balls, glare, and a player leaning over the table can confuse detection, so always check and drag to fix.</p></div></details>`); }

<script>
// Appearance UI for the More screen. Theme engine (apply, presets, storage) lives in the head script as window.PT_Theme.
(function () {
  const T = window.PT_Theme;
  if (!T) return;
  const ORDER = ["dark", "light", "midnight", "felt", "contrast", "warm", "custom"];
  const labels = { dark: "Dark", light: "Light", midnight: "Midnight Blue", felt: "Felt Green", contrast: "High Contrast", warm: "Warm", custom: "Custom" };
  const blurbs = { dark: "Default" };

  function swatchColors(id, saved) {
    if (id === "custom") {
      const s = saved && saved.id === "custom" ? saved : T.load();
      return s && s.id === "custom" ? T.derive(s.bg, s.text, s.accent) : T.PRESETS.dark;
    }
    return T.PRESETS[id] || T.PRESETS.dark;
  }

  function contrastNote(c) {
    const r = Math.min(T.contrast(c.text, c.bg), T.contrast(c.text, c.card));
    if (r >= 4.5) return { low: false, text: "Contrast looks good (" + r.toFixed(1) + ":1)." };
    return { low: true, text: "These colors may be hard to read (" + r.toFixed(1) + ":1). Try a darker background with lighter letters, or the other way around." };
  }

  function swatchesHTML(saved) {
    const cur = (saved && saved.id) || "dark";
    return `<div class="theme-presets" role="listbox" aria-label="Color schemes">${ORDER.map((id) => {
      const c = swatchColors(id, saved);
      const on = cur === id;
      return `<button type="button" class="theme-swatch${on ? " on" : ""}" data-theme="${id}" role="option" aria-selected="${on}" aria-pressed="${on}">
        <span class="theme-dot" style="background:${c.bg};border-color:${c.line}"><i style="background:${c.accent}"></i></span>
        ${labels[id]}${blurbs[id] ? `<small>${blurbs[id]}</small>` : ""}
      </button>`;
    }).join("")}</div>`;
  }

  function customHTML(saved) {
    const on = saved && saved.id === "custom";
    const c = on ? T.derive(saved.bg, saved.text, saved.accent) : T.colorsOf(saved);
    const note = contrastNote(c);
    return `<div id="theme-custom" class="theme-custom"${on ? "" : " hidden"}>
      <div class="theme-colors">
        <label>Background <input type="color" id="tc-bg" value="${c.bg}" aria-label="Background color"></label>
        <label>Letters <input type="color" id="tc-text" value="${c.text}" aria-label="Letter color"></label>
        <label>Accent <input type="color" id="tc-accent" value="${c.accent}" aria-label="Accent color"></label>
      </div>
      <div id="tc-warn" class="callout ${note.low ? "warnc" : ""}" ${note.low ? "" : "hidden"}>${note.text}</div>
    </div>
    <div class="theme-live card" id="tc-preview" aria-hidden="true">
      <div class="t">Preview</div>
      <p class="meta">Secondary text and a sample button, using your colors.</p>
      <div class="row"><span class="btn sm">Button</span><span class="btn ghost sm" style="display:inline-flex">Ghost</span></div>
    </div>`;
  }

  T.sectionHTML = function () {
    const saved = T.load();
    return `<div class="card" id="pttheme">
      <div class="t">Appearance</div>
      <p class="meta">Color scheme for the app. Dark with white letters is the default, and it no longer follows your phone's light or dark setting.</p>
      ${swatchesHTML(saved)}
      ${customHTML(saved)}
      <div class="row theme-actions"><button type="button" class="btn ghost" id="tc-reset">Reset to default</button></div>
    </div>`;
  };

  function refreshPanel() {
    const host = document.getElementById("pttheme");
    if (!host) return;
    const saved = T.load();
    const html = T.sectionHTML();
    const tmp = document.createElement("div");
    tmp.innerHTML = html;
    host.replaceWith(tmp.firstElementChild);
    T.wire();
  }

  T.wire = function () {
    const host = document.getElementById("pttheme");
    if (!host || host.dataset.wired) return;
    host.dataset.wired = "1";
    host.querySelectorAll("[data-theme]").forEach((b) => {
      b.onclick = () => {
        const id = b.dataset.theme;
        if (id === "custom") {
          const cur = T.colorsOf(T.load());
          const prev = T.load();
          const t = { id: "custom", bg: prev.bg || cur.bg, text: prev.text || cur.text, accent: prev.accent || cur.accent };
          T.save(t); T.apply(t);
        } else {
          const t = { id }; T.save(t); T.apply(t);
        }
        refreshPanel();
      };
    });
    const applyCustom = () => {
      const bg = document.getElementById("tc-bg");
      const text = document.getElementById("tc-text");
      const accent = document.getElementById("tc-accent");
      if (!bg || !text || !accent) return;
      const t = { id: "custom", bg: bg.value, text: text.value, accent: accent.value };
      T.save(t);
      const c = T.apply(t);
      const warn = document.getElementById("tc-warn");
      if (warn) {
        const note = contrastNote(c);
        warn.hidden = !note.low;
        warn.classList.toggle("warnc", note.low);
        warn.textContent = note.text;
      }
    };
    ["tc-bg", "tc-text", "tc-accent"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("input", applyCustom);
    });
    const reset = document.getElementById("tc-reset");
    if (reset) reset.onclick = () => { T.reset(); refreshPanel(); };
  };
})();

</script>

function toCanon(raw) {
  const s = String(raw || "").trim();
  if (!s) return "";
  if (CANON[s]) return CANON[s];
  const hit = Object.keys(CANON).find((n) => n.toLowerCase() === s.toLowerCase());
  if (hit) return CANON[hit];
  if (/^dr\.?\s*dave\b/i.test(s)) return "Dr. Dave Alciatore";
  if (/^(NV\s|VEPS\s|VEPP\s|HAPS\b|BU Vol)/i.test(s)) return "Dr. Dave Alciatore";
  return s;
}

function ytEmbedUrl(id, start) {
  let u = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id);
  if (start) u += "?start=" + Number(start);
  return u;
}

function mailto(subject, body) {
  return "mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}
function requestMailto(name) {
  return mailto("Road Warrior credits request: " + name, "Hi, I'm " + name + " (or represent them). Please remove / change: ...");
}
function genericMailto() {
  return mailto("Road Warrior credits request", "Hi, I'm a creator listed in The Road Warrior (or represent one). Please remove / change: ...");
}

function linkLabel(url) {
  const u = String(url);
  if (/youtube\.com|youtu\.be/i.test(u)) return "YouTube";
  if (/facebook\.com/i.test(u)) return "Facebook";
  if (/instagram\.com/i.test(u)) return "Instagram";
  if (/tiktok\.com/i.test(u)) return "TikTok";
  if (/(?:\/\/|\.)x\.com|twitter\.com/i.test(u)) return "X";
  if (/spotify\.com|podcasts\.apple/i.test(u)) return "Podcast";
  if (/forums\.azbilliards/i.test(u)) return "Forum";
  return "Website";
}

function isYTId(s) {
  return typeof s === "string" && s && !s.startsWith("http") && !s.startsWith("/") && s.length >= 8 && s.length <= 15;
}

function addName(set, raw) {
  if (!raw) return;
  if (/\s\/\s/.test(raw)) { String(raw).split(/\s\/\s/).forEach((p) => addName(set, p)); return; }
  const c = toCanon(raw);
  if (c) set.add(c);
}

function walkVids(item, onVid) {
  if (!item) return;
  if (Array.isArray(item) && typeof item[0] === "string") {
    const [lab, src, t, kind] = item;
    if (kind === "read" || kind === "none" || kind === "rest") return;
    if (src) onVid(src, lab);
    return;
  }
  if (Array.isArray(item)) { item.forEach((x) => walkVids(x, onVid)); return; }
  if (typeof item === "object") Object.values(item).forEach((x) => walkVids(x, onVid));
}

function collect() {
  const names = new Set();
  const idMap = new Map();
  function remember(id, creator) {
    if (!isYTId(id) || !creator) return;
    if (!idMap.has(id)) idMap.set(id, creator);
  }
  (typeof DATA !== "undefined" ? DATA : []).forEach((e) => {
    if (e[6] === "YT") { addName(names, e[5]); remember(e[9], e[5]); }
  });
  (typeof XD !== "undefined" ? XD : []).forEach((e) => {
    if (e[4] === "YT") { addName(names, e[3]); remember(e[7], e[3]); }
  });
  (typeof RC !== "undefined" ? RC : []).forEach((e) => {
    if (e[3] === "YT") { addName(names, e[2]); remember(e[6], e[2]); }
  });

  function fromTitle(src, lab) {
    if (!isYTId(src) && !/youtube\.com|youtu\.be/i.test(String(src || ""))) return;
    let id = src;
    const mUrl = String(src).match(/(?:youtu\.be\/|[?&]v=)([A-Za-z0-9_-]{11})/);
    if (mUrl) id = mUrl[1];
    if (idMap.has(id)) { addName(names, idMap.get(id)); return; }
    const paren = String(lab || "").match(/\(([^)]+)\)\s*$/);
    if (paren) { addName(names, paren[1]); return; }
    if (ID_CREATOR[id]) { addName(names, ID_CREATOR[id]); return; }
    if (/VEPS|VEPP|\bNV\s|HAPS|BU Vol/i.test(String(lab || ""))) addName(names, "Dr. Dave Alciatore");
  }

  if (typeof STEPV !== "undefined") walkVids(STEPV, fromTitle);
  if (typeof BENCHV !== "undefined") walkVids(BENCHV, fromTitle);
  if (typeof PROGV !== "undefined") walkVids(PROGV, fromTitle);
  if (typeof BACKNV !== "undefined") walkVids(BACKNV, fromTitle);
  if (typeof LONGERV !== "undefined") walkVids(LONGERV, fromTitle);
  if (typeof CHECK !== "undefined") walkVids(CHECK, fromTitle);
  if (typeof BACKV !== "undefined") walkVids(BACKV, fromTitle);
  if (typeof GEO !== "undefined") {
    GEO.forEach((g) => {
      walkVids(g[7], fromTitle);
      (g[6] || []).forEach((pair) => { if (pair && pair[1]) fromTitle(pair[1], pair[0]); });
    });
  }
  const A = window.Adaptive || {};
  if (A.TESTS) A.TESTS.forEach((t) => walkVids(t.vids, fromTitle));
  walkVids(A.AV, fromTitle);
  walkVids(A.GAMEV, fromTitle);
  walkVids(A.WU, fromTitle);

  const dir = typeof DIRECTORY !== "undefined" ? DIRECTORY : [];
  const byCanon = new Map();
  dir.forEach((d) => {
    const c = toCanon(d[0]);
    if (!c || !names.has(c)) return;
    if (!byCanon.has(c)) byCanon.set(c, []);
    byCanon.get(c).push(d);
  });

  function linksFor(name) {
    const out = [];
    const seen = new Set();
    function push(label, url) {
      if (!url || seen.has(url)) return;
      seen.add(url);
      out.push({ label: label, url: url });
    }
    (byCanon.get(name) || []).forEach((d) => push(linkLabel(d[3]), d[3]));
    (EXTRA_LINKS[name] || []).forEach((l) => push(l.label, l.url));
    const hasYT = out.some((l) => /youtube/i.test(l.label) || /youtube\.com|youtu\.be/i.test(l.url));
    if (!hasYT) push("YouTube search", "https://www.youtube.com/results?search_query=" + encodeURIComponent(name));
    return { links: out, searchOnly: !hasYT };
  }

  function descFor(name) {
    const rows = byCanon.get(name) || [];
    if (!rows.length) return "";
    const exact = rows.find((d) => toCanon(d[0]) === name && d[0].length <= name.length + 8) || rows[0];
    const prefer = rows.find((d) => d[0] === name) || rows.find((d) => /YouTube/i.test(d[2] || "") && (d[1] || "").length > 20) || exact;
    const t = (prefer && prefer[1]) || "";
    if (/verified via/i.test(t)) return (rows.find((d) => d[1] && !/verified via/i.test(d[1])) || prefer)[1] || "";
    return t;
  }

  return [...names].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" })).map((name) => {
    const L = linksFor(name);
    return { name: name, desc: descFor(name), links: L.links, searchOnly: L.searchOnly };
  });
}

  const links = c.links.map((l) => `<a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
