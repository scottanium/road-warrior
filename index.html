<style>
:root{--bg:#0f1412;--card:#18201c;--line:#2a3530;--text:#e9efe9;--sub:#9fb0a6;--accent:#4cc38a;--warn:#e0b44c;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--safe-t) + 10px) 14px 8px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 8px}
h2{font-size:18px;margin:18px 0 8px}

.desc{margin:6px 0 8px}

table{width:100%;border-collapse:collapse;font-size:14px}

.stat{display:inline-block;margin-right:12px}
.vids{display:flex;flex-direction:column;gap:6px;margin-top:8px}

html.aired nav.tabs{padding-right:92px}
details.rc{border-color:var(--accent)}
.count{color:var(--sub);font-size:14px;margin:6px 0}

.dia svg{width:100%;height:auto;display:block;border-radius:10px;margin:8px 0}

label{display:block;margin:6px 0;font-size:14px}

label.tog.big{font-weight:600;font-size:16px}
.ckgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}

.ckgrid input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--accent)}

.block.locked{background:rgba(76,195,138,.08);border-radius:8px}

.pill.sourced,.pill.verified{background:#1d6b47;color:#fff;border-color:#1d6b47}
.pill.derived{background:#2c5d8f;color:#fff;border-color:#2c5d8f}
.pill.estimate{background:#6b6b6b;color:#fff;border-color:#6b6b6b}
.pill.major{background:#7a3db8;color:#fff;border-color:#7a3db8}
.pill.league{background:#2c5d8f;color:#fff;border-color:#2c5d8f}

.pill.manual{background:#555;color:#fff}
.card.tour.unverified{border-left:5px solid #d9822b}

.legend{margin:6px 0 4px}
.callout.warnc{border-left-color:#d9822b}

.timer .clock{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.timer.sttimer{position:relative;top:auto}.sttimer .row.strow{flex-wrap:wrap;gap:6px;justify-content:center}.sttimer .strow .btn{flex:1 1 30%;min-width:0;padding:0 8px}
.sttimer .clock.over{color:var(--warn)}.stup{background:#5a3d00;color:#fff;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:16px}
@media (prefers-color-scheme: light){.stup{background:#fff1cc;color:#3d2a00;border:1px solid #9a6a00}}
.btn.sm,button.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.stbtns{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stbtns .stnow{display:none;font-weight:700;color:var(--accent)}
.stcur{border-radius:10px;box-shadow:inset 0 0 0 2px var(--accent);background:rgba(76,195,138,.08)}.block.stcur{padding-left:8px;padding-right:8px}.stcur .stnow{display:inline}
#stpill{position:fixed;left:10px;right:10px;bottom:calc(66px + var(--safe-b));z-index:11;min-height:44px;border-radius:999px;border:1px solid var(--accent);background:var(--card);color:var(--text);font-weight:600;font-size:14px;padding:6px 14px;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stpill.over{background:#5a3d00;color:#fff;border-color:var(--warn)}
#sttoast{position:fixed;left:12px;right:12px;top:calc(10px + var(--safe-t));z-index:30;background:var(--card);color:var(--text);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.4);opacity:0;transform:translateY(-12px);transition:opacity .25s,transform .25s;pointer-events:none}#sttoast.show{opacity:1;transform:none}
.stset{margin-top:8px}.stask .row{margin-top:6px;gap:6px}
#ptinstall{position:fixed;left:10px;right:10px;bottom:calc(66px + var(--safe-b) + 10px);z-index:12;max-width:440px;margin:0 auto;background:var(--card);color:var(--text);border:1px solid rgba(76,195,138,.45);border-radius:20px;padding:16px 16px 12px;box-shadow:0 14px 40px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);font-size:15px;line-height:1.35;opacity:0;transform:translateY(16px);transition:opacity .28s ease,transform .32s cubic-bezier(.2,.8,.2,1)}
#ptinstall.in{opacity:1;transform:none}

.ins-head{display:flex;gap:12px;align-items:center}
.ins-ic{width:52px;height:52px;border-radius:12px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.08)}

.ins-hd{flex:1;min-width:0}.ins-hd h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}.ins-hd h2 svg{width:20px;height:20px;color:var(--accent)}

.ins-g{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:rgba(76,195,138,.14);color:var(--accent);display:flex;align-items:center;justify-content:center}.ins-g svg{width:20px;height:20px}
.ins-t{flex:1;min-width:0}.ins-t b{font-weight:650}.ins-dim{color:var(--sub);font-size:13px}
.ins-inl svg{width:15px;height:15px;vertical-align:-3px}
.ins-note{margin:6px 2px 0;color:var(--sub);font-size:13px}
.ins-acts{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.ins-pri{flex:1;min-height:44px;border:0;border-radius:12px;background:var(--accent);color:#06140d;font-weight:700;font-size:16px}
.ins-sec{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-weight:600;font-size:15px}
.ins-lnk{min-height:44px;padding:0 6px;border:0;background:none;color:var(--sub);font-size:14px;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.ins-msg{margin:6px 2px 0;font-size:13px;color:var(--accent);word-break:break-all}.ins-msg:empty{display:none}
.ins-arrow{flex:0 0 auto;width:22px;height:22px;color:var(--accent);animation:insb 1.6s ease-in-out infinite}.ins-arrow svg{width:22px;height:22px}
#ptinstall.ins-ipad .ins-arrow{transform:rotate(180deg);animation-name:insu}
@keyframes insb{0%,100%{transform:translateY(-2px);opacity:.7}50%{transform:translateY(3px);opacity:1}}
@keyframes insu{0%,100%{transform:rotate(180deg) translateY(-2px);opacity:.7}50%{transform:rotate(180deg) translateY(3px);opacity:1}}

#stpill{bottom:calc(66px + var(--safe-b) + var(--insh,0px))}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.mgrid label{min-width:0}
.mset{border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:4px 10px 8px}.mset legend{font-weight:700;padding:0 6px}
.mnet{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;border-radius:12px;padding:10px;margin:10px 0;border:2px solid var(--line)}.mnet b{font-size:22px}
.mnet.ok{border-color:#1e7b34;background:rgba(30,123,52,.15)}.mnet.bad{border-color:#d50000;background:rgba(213,0,0,.12)}.mnet.even{border-color:var(--line)}
.msum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.msum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}.msum span{display:block;font-size:12px;color:var(--sub)}.msum b{font-size:17px;font-variant-numeric:tabular-nums}
.msum .ok{border-color:#1e7b34}.msum .ok b{color:#5fd07a}.msum .bad{border-color:#d50000}.msum .bad b{color:#ff6b6b}
@media (prefers-color-scheme: light){.msum .ok b{color:#1e7b34}.msum .bad b{color:#b00000}}
.mrow{border-top:1px solid var(--line);padding:10px 0}.mrow:first-of-type{border-top:0}
.mcal{max-width:340px;margin:8px auto 0}.mcdisp{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:right;font-size:28px;font-variant-numeric:tabular-nums;min-height:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkeys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.mkey{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:600}.mkey.op{background:rgba(76,195,138,.16);color:var(--accent)}.mkey.z{grid-column:span 2}
.mrank{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}.mrank th,.mrank td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
#mfab{position:fixed;right:12px;bottom:calc(66px + var(--safe-b) + 10px + var(--insh,0px));z-index:11;width:48px;height:48px;border-radius:999px;border:1px solid var(--accent);background:var(--card);color:var(--accent);font-size:22px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.35)}#mfab.on{background:var(--accent);color:#06140d}

.labwrap{display:flex;gap:8px;align-items:stretch}.labtbl{flex:0 0 84%;max-width:84%;min-width:0}

.labgrip b{font-size:20px;line-height:1}.labgrip .gt{writing-mode:vertical-rl;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.labgrip .gl{width:4px;flex:0 0 36px;border-radius:2px;background:var(--line)}

@keyframes ptspin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){#ptrefresh.spin svg{animation:none}}

header h1{padding-right:48px}

<body>
<header>
