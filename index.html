<style>
:root{--bg:#0f1412;--card:#18201c;--line:#2a3530;--text:#e9efe9;--sub:#9fb0a6;--accent:#4cc38a;--warn:#e0b44c;--on-accent:#06140d;--ok:#5fd07a;--ok-line:#1e7b34;--bad:#ff6b6b;--bad-line:#d50000;--warn-bg:#5a3d00;--warn-fg:#fff;--lock-on:#e0b44c;--lock-bg:color-mix(in srgb,var(--lock-on) 14%,transparent);--accent-soft:color-mix(in srgb,var(--accent) 16%,transparent);--fill:color-mix(in srgb,var(--text) 6%,transparent);--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

.timer.sttimer{position:relative;top:auto}.sttimer .row.strow{flex-wrap:wrap;gap:6px;justify-content:center}.sttimer .strow .btn{flex:1 1 30%;min-width:0;padding:0 8px}

.stbtns{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stbtns .stnow{display:none;font-weight:700;color:var(--accent)}
.stcur{border-radius:10px;box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}.block.stcur{padding-left:8px;padding-right:8px}.stcur .stnow{display:inline}
#stpill{position:fixed;left:10px;right:10px;bottom:calc(66px + var(--safe-b));z-index:11;min-height:44px;border-radius:999px;border:1px solid var(--accent);background:var(--card);color:var(--text);font-weight:600;font-size:14px;padding:6px 14px;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ins-msg{margin:6px 2px 0;font-size:13px;color:var(--accent);word-break:break-all}.ins-msg:empty{display:none}
